name: Salon Management App CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root & Server Dependencies
        run: |
          npm install
          cd server && npm install

      - name: Run Server Business Rules Unit Tests
        run: |
          node server/src/__tests__/business.test.js

      - name: Install Client Dependencies & Build Frontend
        run: |
          cd client
          npm install
          npm run build
