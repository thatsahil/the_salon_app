<script>
  document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('clientSearch');
    const clientList = document.getElementById('clientList');
    const clientItems = clientList.querySelectorAll('button');
    const emptyState = document.getElementById('emptyState');

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      let visibleCount = 0;

      clientItems.forEach(item => {
        const name = item.querySelector('h3').textContent.toLowerCase();
        if (name.includes(term)) {
          item.style.display = 'flex';
          visibleCount++;
          // Add a tiny staggered fade-in effect when searching
          item.style.animation = 'none';
          item.offsetHeight; // trigger reflow
          item.style.animation = 'fadeIn 0.2s ease-out forwards';
        } else {
          item.style.display = 'none';
        }
      });

      if (visibleCount === 0) {
        clientList.classList.add('hidden');
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
      } else {
        clientList.classList.remove('hidden');
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
      }
    });
    
    // Add custom keyframes for search interaction
    const style = document.createElement('style');
    style.textContent = `
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }
    `;
    document.head.appendChild(style);
  });
